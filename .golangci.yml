linters:
  enable-all: false
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - misspell
    - bodyclose
    - noctx
    - gocritic
    - prealloc

linters-settings:
  goimports:
    local-prefixes: github.com/artnerc/echo-elm
  misspell:
    ignore-words:
      - healthit
  revive:
    rules:
      - name: exported
      - name: var-naming
      - name: error-return
      - name: if-return
      - name: increment-decrement
      - name: var-declaration
  gocritic:
    enabled-tags:
      - diagnostic
      - performance

issues:
  exclude-rules:
    # Allow long lines in generated files
    - path: _gen\.go
      linters:
        - revive
    # Exclude ANTLR-generated parser package from all linters
    - path: internal/parser/cqlparser/
      linters:
        - all
    # Allow unused in test helpers
    - path: _test\.go
      linters:
        - unused

  exclude-dirs:
    - internal/parser/cqlparser

run:
  timeout: 5m
  go: '1.26'
