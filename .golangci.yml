version: "2"

linters:
  enable:
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused
    - revive
    - misspell
    - bodyclose
    - noctx
    - gocritic
    - prealloc
  settings:
    misspell:
      ignore-rules:
        - healthit
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: error-return
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
  exclusions:
    paths:
      - internal/parser/cqlparser
    rules:
      - path: _gen\.go
        linters:
          - revive
      - path: internal/parser/cqlparser/
        linters:
          - all
      - path: _test\.go
        linters:
          - unused
      - path: internal/
        text: 'comment on exported'
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/artnerc/echo-elm

run:
  timeout: 5m
  go: '1.26'
