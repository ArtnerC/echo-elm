# option_profiles defines named translator option configurations.
# Each profile lists the CQF CLI flags (cliFlags) and the equivalent
# echo-elm translator options (translatorOptions) that should produce
# matching output. Fixtures reference profiles by name; "all" means every profile.
option_profiles:
  default:
    description: CQF CLI defaults — no annotations, no locators, SignatureLevel=None
    cliFlags: []
    translatorOptions:
      enableAnnotations: false
      enableLocators: false
      signatureLevel: None

  annotations:
    description: Enable annotation blocks on every ELM node
    cliFlags: [--annotations]
    translatorOptions:
      enableAnnotations: true
      enableLocators: false
      signatureLevel: None

  locators:
    description: Enable localId/locator attributes on every ELM node
    cliFlags: [--locators]
    translatorOptions:
      enableAnnotations: false
      enableLocators: true
      signatureLevel: None

  annotations-locators:
    description: Annotations and locators together (common artifact authoring profile)
    cliFlags: [--annotations, --locators]
    translatorOptions:
      enableAnnotations: true
      enableLocators: true
      signatureLevel: None

  debug:
    description: CQF --debug expands to annotations + locators + result-types
    cliFlags: [--debug]
    translatorOptions:
      enableAnnotations: true
      enableLocators: true
      enableResultTypes: true
      signatureLevel: None

  measure-bundle:
    description: >
      The option set published measure bundles declare in their CqlToElmInfo
      annotation. Result types are on, which is what makes the type-rendering and
      inference surface observable at all; list traversal, demotion and promotion
      are off. No other profile matches this combination, which is why gaps that
      only appear in measure-shaped content were invisible (issues/05 Part 1).
    cliFlags:
      - --locators
      - --result-types
      - --disable-list-traversal
      - --disable-list-demotion
      - --disable-list-promotion
    translatorOptions:
      enableAnnotations: false
      enableLocators: true
      enableResultTypes: true
      disableListTraversal: true
      disableListDemotion: true
      disableListPromotion: true
      signatureLevel: None

  sig-overloads:
    description: SignatureLevel=Overloads — record signatures for overloaded calls
    cliFlags: [--signatures, Overloads]
    translatorOptions:
      enableAnnotations: false
      enableLocators: false
      signatureLevel: Overloads

  sig-all:
    description: SignatureLevel=All — record signatures on every call
    cliFlags: [--signatures, All]
    translatorOptions:
      enableAnnotations: false
      enableLocators: false
      signatureLevel: All

  disable-list-demotion:
    description: Disable implicit list demotion (singleton-from-list coercions)
    cliFlags: [--disable-list-demotion]
    translatorOptions:
      enableAnnotations: false
      enableLocators: false
      signatureLevel: None
      disableListDemotion: true

  disable-list-promotion:
    description: Disable implicit list promotion (scalar-to-list coercions)
    cliFlags: [--disable-list-promotion]
    translatorOptions:
      enableAnnotations: false
      enableLocators: false
      signatureLevel: None
      disableListPromotion: true

  strict:
    description: CQF --strict (disable-list-traversal + demotion + promotion + method-invocation)
    cliFlags: [--strict]
    translatorOptions:
      enableAnnotations: false
      enableLocators: false
      signatureLevel: None
      disableListDemotion: true
      disableListPromotion: true
      disableListTraversal: true
      disableMethodInvocation: true

  compat-1.4:
    description: Compatibility level 1.4 (pre-1.5 semantics)
    cliFlags: [--compatibility-level, "1.4"]
    translatorOptions:
      enableAnnotations: false
      enableLocators: false
      signatureLevel: None
      compatibilityLevel: "1.4"

  enable-interval-demotion:
    description: Enable implicit interval demotion (Interval<T> → T)
    cliFlags: [--enable-interval-demotion]
    translatorOptions:
      enableAnnotations: false
      enableLocators: false
      signatureLevel: None
      enableIntervalDemotion: true

  enable-interval-promotion:
    description: Enable implicit interval promotion (T → Interval<T>)
    cliFlags: [--enable-interval-promotion]
    translatorOptions:
      enableAnnotations: false
      enableLocators: false
      signatureLevel: None
      enableIntervalPromotion: true

fixtures:
  - path: smoke/Minimal.cql
    description: Library header only
    expectedStatus: success
    profiles: all
    tags: [smoke, cqf-corpus]

  - path: smoke/IncludeTest.cql
    description: FHIR model + include + Patient context + define
    expectedStatus: success
    profiles: [default, annotations, locators, annotations-locators, debug, sig-overloads, sig-all, disable-list-demotion, disable-list-promotion, compat-1.4]
    tags: [smoke, cqf-corpus]

  # ── CQFramework cql-to-elm test corpus (verbatim imports) ─────────────────

  - path: cqf-tests/DateTimeLiteralTest.cql
    description: "DateTime, Date, and Time literal expressions"
    expectedStatus: success
    profiles: all
    tags: [smoke, cqf-corpus, datetime]

  - path: cqf-tests/DefaultContext.cql
    description: Default context library with null arithmetic
    expectedStatus: success
    profiles: all
    tags: [smoke, cqf-corpus, context]

  - path: cqf-tests/QuantityLiteralTest.cql
    description: Quantity literals, invalid units, and conversions
    # CQF rejects ''shab-shab-shab'' as an invalid UCUM unit at compile time.
    # No JSON output is produced. Echo-elm should also reject it.
    expectedStatus: failure
    profiles: [default]
    tags: [cqf-corpus, quantity]

  - path: cqf-tests/RatioLiteralTest.cql
    description: Ratio literal expressions
    expectedStatus: success
    profiles: all
    tags: [smoke, cqf-corpus, ratio]

  - path: cqf-tests/ParameterTest.cql
    description: Tuple and list parameter types
    expectedStatus: success
    profiles: all
    tags: [cqf-corpus, parameters]

  - path: cqf-tests/InTest.cql
    description: In operator with intervals and lists (has implicit queries — excludes strict)
    expectedStatus: success
    profiles: [default, annotations, locators, annotations-locators, sig-overloads, sig-all, disable-list-demotion, disable-list-promotion, enable-interval-demotion, enable-interval-promotion, compat-1.4]
    # upstream-error: CQF produces no output for disable-list-promotion (type-checks fail upstream).
    excludeProfiles: [disable-list-promotion]
    tags: [cqf-corpus, operators]

  - path: cqf-tests/TenDividedByTwo.cql
    description: Integer division and implicit decimal promotion
    # Requires TranslationTestsCommon library not in corpus. CQF fails.
    expectedStatus: failure
    profiles: [default]
    tags: [cqf-corpus, arithmetic]

  - path: cqf-tests/TupleDifferentKeys.cql
    description: Tuple equality with different key sets
    # Requires TranslationTestsCommon library not in corpus. CQF fails.
    expectedStatus: failure
    profiles: [default]
    tags: [cqf-corpus, tuples]

  - path: cqf-tests/TestComments.cql
    description: Library with inline comments, FHIR model, queries, and function definition
    expectedStatus: success
    profiles: [default, annotations, locators, annotations-locators, debug, sig-overloads, sig-all, disable-list-demotion, disable-list-promotion, compat-1.4]
    tags: [cqf-corpus, comments, fhir]

  - path: cqf-tests/TestPatientContext.cql
    description: Multiple context declarations with QDM model
    expectedStatus: success
    profiles: all
    tags: [cqf-corpus, context, qdm]

  - path: cqf-tests/TranslationTests.cql
    description: Comprehensive translation tests using QUICK model
    expectedStatus: success
    profiles: [default, annotations, locators, annotations-locators, sig-overloads, sig-all, compat-1.4]
    tags: [cqf-corpus, translation]

  - path: cqf-tests/ArithmeticOpsTest.cql
    description: Arithmetic operators, aggregates, and math functions
    expectedStatus: success
    profiles: all
    tags: [cqf-corpus, arithmetic]

  - path: cqf-tests/StringFunctionsTest.cql
    description: String functions (Length, Upper, Lower, Substring, etc.)
    expectedStatus: success
    profiles: all
    # upstream-error: CQF produces no output for strict/disable-list-promotion
    # combinations. measure-bundle is the same cause — it disables demotion and
    # promotion, and IndexOf(String, String) / Contains(String, String) only
    # resolve through them.
    excludeProfiles: [strict, disable-list-promotion, measure-bundle]
    tags: [cqf-corpus, string]

  - path: cqf-tests/ConditionalExpressionsTest.cql
    description: If/then/else, case/when, null handling
    expectedStatus: success
    profiles: all
    tags: [cqf-corpus, conditional]

  - path: cqf-tests/IntervalOpsTest.cql
    description: Interval operators, timing, union/intersect/except
    expectedStatus: success
    profiles: all
    tags: [cqf-corpus, interval]

  - path: cqf-tests/ConversionFunctionsTest.cql
    description: Conversion functions and type cast/is/as expressions
    expectedStatus: success
    profiles: all
    tags: [cqf-corpus, conversion]

  - path: cqf-tests/ListOperationsTest.cql
    description: List operators, aggregates, sort, set operations
    expectedStatus: success
    profiles: [default, annotations, locators, annotations-locators, sig-overloads, sig-all, disable-list-demotion, disable-list-promotion, compat-1.4]
    tags: [cqf-corpus, list]

  - path: cqf-tests/QueryExpressionsTest.cql
    description: Query expressions, from/where/return/sort/let/with
    expectedStatus: success
    profiles: [default, annotations, locators, annotations-locators, sig-overloads, sig-all, compat-1.4]
    tags: [cqf-corpus, query]

  # ── RA Disease Activity Monitoring measure ─────────────────────────────────

  - path: ra-measure/RAMeasureTerminology-1.0.0.cql
    description: RA measure terminology library — code systems, value sets, DRCs (no model, no logic)
    expectedStatus: success
    profiles: [default, annotations, locators, annotations-locators]
    tags: [ra-measure]

  - path: ra-measure/RAMeasure-1.0.0.cql
    description: RA Disease Activity Monitoring proportion measure (FHIR R4) with DMARD therapy
    expectedStatus: success
    profiles: [default, annotations, locators, annotations-locators]
    # CQF folds the Date bounds of an Interval<DateTime> parameter default
    # directly into the promoted Interval. Older releases lowered it through
    # Property(low/high/lowClosed/highClosed) accessors over the source Interval;
    # the pinned release does not, and the golden is the folded form.
    tags: [ra-measure]

  # ── ELM node emission regressions (issues/03-cqf-parity-gaps.md) ────────────
  # Each fixture pins a gap identified by the 2025 HEDIS measure comparison.

  - path: elm-nodes/DateTimeComponents.cql
    description: "date/time/timezoneoffset from → DateFrom/TimeFrom/TimezoneOffsetFrom; components → DateTimeComponentFrom"
    expectedStatus: success
    profiles: all
    tags: [elm-nodes, datetime]

  - path: elm-nodes/QueryClauses.cql
    description: Sort, aggregate (starting/all/distinct), let and return clauses with accumulator and sort-expression scoping
    expectedStatus: success
    # compat-1.4 excluded: the aggregate query clause was introduced in CQL 1.5,
    # so CQF rejects this fixture at compatibility level 1.4.
    profiles: [default, annotations, locators, annotations-locators, debug, sig-overloads, sig-all]
    tags: [elm-nodes, query]

  - path: elm-nodes/Terminology.cql
    description: Code system, value set, code and concept declarations and their reference nodes
    expectedStatus: success
    profiles: all
    tags: [elm-nodes, terminology]

  - path: elm-nodes/MembershipOperators.cql
    description: "in list promotion, included in/during point demotion, and != / !~ lowering to Not(...)"
    expectedStatus: success
    # sig-overloads excluded: CQF emits a signature on some In expressions where
    # no coercion occurred — `2 in {1,2,3}` and `"Day" included in "Period"` carry
    # one, while `5 in Interval[1,10]` and `"Day" in "Period"` do not — and the
    # discriminator is not yet understood. The emitted ELM matches at every other
    # profile, including sig-all, so this is signature metadata only.
    profiles: [default, annotations, locators, annotations-locators, debug, sig-all, compat-1.4]
    tags: [elm-nodes, operators]

  - path: elm-nodes/QuotedIdentifiers.cql
    description: Quoted identifiers in reference, query source, relationship source and function call positions
    expectedStatus: success
    profiles: [default, annotations, locators, annotations-locators, debug, sig-overloads, sig-all, compat-1.4]
    tags: [elm-nodes, identifiers]

  - path: elm-nodes/AnnotationTags.cql
    description: Block-comment @tag annotations — any valid-identifier tag name is emitted, others are dropped
    expectedStatus: success
    profiles: [default, annotations, locators, annotations-locators, debug]
    tags: [elm-nodes, annotations]

  - path: elm-nodes/SharedTerminology.cql
    description: Shared terminology library included by CrossLibraryTerminology
    expectedStatus: success
    profiles: all
    tags: [elm-nodes, terminology]

